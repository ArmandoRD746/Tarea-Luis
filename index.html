<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundial 2026 - Partidos de México</title>
  <style>
    :root {
      --primary: #006847;
      --secondary: #ce1126;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --muted: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
      background: linear-gradient(135deg, var(--primary), #004d34);
      color: white;
      border-radius: 8px;
    }

    header h1 { font-size: 2rem; }
    header p { opacity: 0.9; }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Estado de Carga / Spinner */
    .loading-state {
      text-align: center;
      padding: 50px 0;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #ccc;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mensajes de Error */
    .error-card {
      background-color: #ffe6e6;
      border-left: 5px solid var(--secondary);
      padding: 15px 20px;
      border-radius: 6px;
      color: #900;
    }

    /* Renderizado de Partidos */
    .matches-grid {
      display: grid;
      gap: 20px;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border-top: 4px solid var(--primary);
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .match-teams {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 20px;
    }

    .team {
      text-align: center;
      flex: 1;
    }

    .team-name {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .score {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
      padding: 0 15px;
    }

    .match-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      background: #fafafa;
      padding: 15px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .details-section h4 {
      margin-bottom: 8px;
      color: var(--primary);
      border-bottom: 1px solid #ddd;
      padding-bottom: 4px;
    }

    .details-section ul {
      list-style: none;
    }

    .details-section li {
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .match-details { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>México - Copa Mundial FIFA 2026</h1>
    <p>Seguimiento de Partidos, Marcadores y Estadísticas</p>
  </header>

  <main id="app">
    <!-- Estado de carga inicial -->
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Consultando calendario y estadísticas de la FIFA...</p>
    </div>

    <!-- Contenedor donde se insertarán las tarjetas -->
    <div id="matches-container" class="matches-grid" style="display: none;"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
